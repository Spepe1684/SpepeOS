<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpepeOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Slackside+One&display=swap" rel="stylesheet" />
    <link rel="stylesheet" type="text/css" href="style.css" />
  </head>

  <body style="background-image: url('landscape.jp.jpg'); background-size: cover; background-attachment: fixed; background-position: center;">
    <div class="topbar">
      <p id="welcomeopen" class="brand">SpepeOS</p>
      <p class="time"><span id="current-time"></span></p>
    </div>

    <div class="text-background">
      <div class="left-content" style="position: relative;">
        <div id="welcome" class="window">
          <div id="welcomeheader" class="window-header">
            <p class="window-title">Welcome</p>
            <button id="welcomeclose" class="window-close" type="button" aria-label="Close window">×</button>
          </div>

          <div class="window-body">
            <img src="b53c81b8c124eff047379eb272ec9a13.jpg" alt="SpepeOS icon" />
            <h1>SpepeOS</h1>
            <h2>｡･:*:･ﾟ★,｡･:*:･ﾟ☆‧͙⁺˚*･༓☾</h2>
          </div>
        </div>
      </div>
    </div>

    <div id="desktopApps" style="padding-top: 24px; padding-left: 16px;">
      <img src="notes.jpg" style="width: 64px; height: 64px; border-radius: 16px;">
      <p style="margin: 0px; color: #fff; font-size: 25px;">Notes</p>
    </div>

    <script src="script.js"></script>
    <script>
      function updateTime() {
        var currentTime = new Date().toLocaleString();
        document.getElementById("current-time").innerHTML = currentTime;
      }

      setInterval(updateTime, 1000);
      updateTime();
    </script>
  </body>
</html>
